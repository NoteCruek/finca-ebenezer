<style>
:root{--bg:#f6f3ea;--c:#fff;--t:#2b2b22;--g:#2f6b3a;--m:#6b6b5e;--b:#ddd8c8;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#1b1d18;--c:#262921;--t:#ecebe0;--g:#6fbf7e;--m:#a5a595;--b:#3a3d33;color-scheme:dark}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font:15px system-ui,sans-serif;padding-bottom:70px}
header{display:flex;align-items:center;gap:8px;padding:10px 14px;background:var(--g);color:#fff}header b{font-size:18px}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--c);border-top:1px solid var(--b);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;border:0;background:none;color:var(--m);padding:8px 2px;font-size:11px}nav button.on{color:var(--g);font-weight:700}
main{padding:12px;max-width:640px;margin:auto}.card{background:var(--c);border:1px solid var(--b);border-radius:12px;padding:12px;margin-bottom:10px}
input,select,textarea{width:100%;padding:9px;margin:3px 0 8px;border:1px solid var(--b);border-radius:8px;background:var(--bg);color:var(--t);font:inherit}
label{font-size:12px;color:var(--m)}button.p{background:var(--g);color:#fff;border:0;border-radius:8px;padding:10px 14px;font:inherit;margin:2px}button.s{background:none;border:1px solid var(--g);color:var(--g);border-radius:8px;padding:8px 12px;margin:2px}
.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}.car{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:6px}.car img{width:100%;flex:0 0 100%;height:220px;object-fit:cover;border-radius:10px;scroll-snap-align:center}
.sm{color:var(--m);font-size:12px}.ov{position:fixed;inset:0;background:#0008;display:flex;align-items:center;justify-content:center;z-index:9;padding:16px}.ov .card{max-width:340px;width:100%}h3{margin:6px 0}
header{background:linear-gradient(135deg,#2f6b3a,#1f4d29);box-shadow:0 2px 6px #0003}.card{box-shadow:0 1px 3px #0001}
button.big{width:100%;padding:14px;font-size:16px;margin:0 0 10px}.it{display:flex;gap:12px;align-items:center}.it img{width:64px;height:64px;border-radius:12px;object-fit:cover}
.del{background:none;border:0;color:#c33;font-size:16px;padding:4px 8px;margin-left:auto}.row2{display:flex;align-items:center;gap:6px;padding:8px 12px}nav button.on{border-top:3px solid var(--g)}

:root{--bg:#eaf0e3;--c:#fbfcf8;--t:#1c2a1f;--m:#5d6b5f;--b:#d3ddc8;--g:#25613a;--g2:#1a4a2b;--gs:#dcecd9;--h:#d8a331;--hs:#f6e8c1;--r:#b83a26;--rs:#f8dcd5;--on:#fff;--ring:rgba(37,97,58,.22);--sh:0 1px 2px rgba(28,42,31,.06),0 8px 20px -10px rgba(28,42,31,.22);--serif:"Palatino Linotype",Palatino,Georgia,serif}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#141a15;--c:#1f2921;--t:#e8efe3;--m:#9fb0a2;--b:#324034;--g:#7cc58c;--g2:#5fae72;--gs:#25382a;--h:#e6b94d;--hs:#3b3320;--r:#ef7a66;--rs:#3d2420;--on:#10200f;--ring:rgba(124,197,140,.28)}}
body{line-height:1.45}
header{position:sticky;top:0;z-index:6;padding:12px 16px 28px;background:linear-gradient(135deg,#2a6b40,#17402a);box-shadow:none}
header b{font:700 21px var(--serif);letter-spacing:.2px}header img{width:42px;height:42px}
.hills{position:absolute;left:0;right:0;bottom:-1px;width:100%;height:18px}.hills path{fill:var(--bg)}
#st{background:#ffffff24;padding:4px 10px;border-radius:99px}
h3{font:700 17px var(--serif)}
.card{border-radius:16px;padding:14px;box-shadow:var(--sh)}
input,select,textarea{border-width:1.5px;border-radius:10px;padding:11px 12px;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--g);box-shadow:0 0 0 3px var(--ring)}
label{font-weight:600}
button{cursor:pointer;transition:transform .12s,background .2s,box-shadow .2s}button:active{transform:scale(.96)}
button.p{background:var(--g);color:var(--on);border-radius:12px;font-weight:600}
button.s{border-radius:12px;border-width:1.5px;font-weight:600}
button.big{box-shadow:0 10px 20px -12px var(--g)}
.del{background:var(--rs);color:var(--r);border-radius:50%;width:28px;height:28px;padding:0;flex:none;font-size:13px}
nav{background:var(--c);backdrop-filter:blur(8px)}
nav button{position:relative;font-weight:600;transition:color .2s,transform .2s}
nav button.on{border-top:0;transform:translateY(-2px)}
nav button.on:before{content:"";position:absolute;top:-2px;left:28%;right:28%;height:3px;border-radius:0 0 3px 3px;background:var(--g);animation:grow .25s}
.a{cursor:pointer;transition:transform .15s}.a:active{transform:scale(.98)}
.it img,.it .ph{width:64px;height:64px;border-radius:16px;object-fit:cover;flex:none}.it>div:nth-child(2){min-width:0}
.ph,.bigph{display:grid;place-items:center;font-size:30px;background:linear-gradient(135deg,var(--gs),var(--hs))}
.car .bigph{height:200px;border-radius:12px;font-size:72px;flex:0 0 100%}
.lk{color:var(--g);font-weight:700;cursor:pointer}
.drop{display:block;text-align:center;padding:14px;border:1.5px dashed var(--g);border-radius:12px;color:var(--g);font-weight:600;cursor:pointer;margin:4px 0 8px}.drop input{display:none}
#pv img{width:84px;height:84px;flex:none;border-radius:12px;object-fit:cover}
.tip,.warn{border-radius:10px;padding:8px 10px;margin:6px 0;font-size:13px}.tip{background:var(--gs)}.warn{background:var(--hs)}
.bob{display:inline-block;font-size:40px;animation:bob 2.4s ease-in-out infinite}
#toast{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom,0px));transform:translate(-50%,16px);opacity:0;pointer-events:none;background:#17402a;color:#fff;padding:10px 16px;border-radius:99px;font-weight:600;font-size:14px;z-index:40;transition:opacity .25s,transform .25s;max-width:90vw;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}#toast.err{background:#a8321f}
.ov{animation:fade .18s;backdrop-filter:blur(2px)}.ov .card{animation:pop .25s cubic-bezier(.2,1.2,.4,1)}
#v.in>*{animation:rise .4s cubic-bezier(.2,.8,.2,1) backwards;animation-delay:calc(var(--i,0)*45ms)}
#v.in>:nth-child(2){--i:1}#v.in>:nth-child(3){--i:2}#v.in>:nth-child(4){--i:3}#v.in>:nth-child(5){--i:4}#v.in>:nth-child(6){--i:5}
@keyframes fade{from{opacity:0}}@keyframes pop{from{opacity:0;transform:scale(.9)}}@keyframes rise{from{opacity:0;transform:translateY(10px)}}@keyframes bob{50%{transform:translateY(-6px)}}@keyframes grow{from{transform:scaleX(0)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.pt{font:700 24px var(--serif);margin:4px 2px 10px}
.chip{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:700;background:var(--gs);color:var(--g);font-style:normal}.chip.late{background:var(--rs);color:var(--r)}.chip.soon{background:var(--hs);color:#8a6410}
@media(prefers-color-scheme:dark){.chip.soon{color:var(--h)}}
.kv3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}.kv3 b{display:block;font:700 24px var(--serif);color:var(--g)}.kv3 span{font-size:11px;color:var(--m)}
.nr{display:grid;grid-template-columns:1.3fr .8fr 1fr auto;gap:6px;align-items:center;padding:8px 0;border-top:1px dashed var(--b);font-size:13px}
.bar{height:8px;border-radius:99px;background:var(--bg);overflow:hidden;margin:8px 0}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--g),var(--h));border-radius:99px;animation:wid .8s cubic-bezier(.2,.8,.2,1)}@keyframes wid{from{width:0}}
.chs{display:flex;flex-wrap:wrap}.ch2{display:inline-block;margin:0}.ch2 input{display:none}.ch2 span{display:inline-block;padding:6px 12px;border-radius:99px;border:1.5px solid var(--b);margin:3px 5px 3px 0;font-size:13px;font-weight:600;cursor:pointer;transition:background .15s,color .15s,transform .12s}.ch2 span:active{transform:scale(.94)}.ch2 input:checked+span{background:var(--g);color:var(--on);border-color:var(--g)}
.kv4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center}.kv4 b{display:block;font:700 22px var(--serif);color:var(--g)}.kv4 span{font-size:10.5px;color:var(--m)}
.qa{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}.qa button{padding:10px 4px;font-size:12px;line-height:1.3;margin:0}
.bot{display:flex;gap:10px;align-items:flex-start}.bot>i{font-style:normal;font-size:28px;background:var(--gs);border-radius:50%;width:46px;height:46px;display:grid;place-items:center;flex:none}
details{border-top:1px dashed var(--b);padding:8px 0;margin-top:8px;font-size:13px}summary{cursor:pointer;font-weight:700;color:var(--g)}details ol{padding-left:18px;margin:6px 0}
.al{display:flex;gap:8px;align-items:center;padding:7px 0;border-top:1px dashed var(--b);font-size:13px}.al:first-of-type{border:0}
.fl{display:flex;gap:6px;overflow-x:auto;padding:2px 0 8px}.fl button{flex:none;border:1.5px solid var(--b);background:none;color:var(--t);border-radius:99px;padding:5px 12px;font-size:13px;font-weight:600;margin:0}.fl button.on{background:var(--g);color:var(--on);border-color:var(--g)}
.ordr{display:grid;grid-template-columns:1fr 100px;gap:8px;align-items:center;padding:6px 0;border-top:1px dashed var(--b)}.ordr input{margin:0}
.tb{width:100%;border-collapse:collapse;font-size:12px}.tb td,.tb th{border:1px solid var(--b);padding:4px;text-align:center}.tb td:first-child{text-align:left}
@media print{header,nav,#toast,.noprint,footer{display:none!important}body{padding:0;background:#fff;color:#000}.card{box-shadow:none;break-inside:avoid;background:#fff}}
button.p,button.s{min-height:46px;padding:11px 16px;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:6px}button.big{min-height:54px;font-size:16px}
input,select,textarea{min-height:46px;font-size:15px}textarea{min-height:80px}.del{width:34px;height:34px;font-size:14px}
nav button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-size:10.5px;min-height:58px;padding:6px 1px}.ni{font-size:21px;line-height:1.1}

const TE={lac:["Meta reproductiva: un parto por vaca cada ~12–13 meses (intervalo entre partos cercano a 365 días).","Con ternero al pie, el amamantamiento restringido (2 veces al día) suele acortar el anestro posparto; consúltalo con tu veterinario.","Controla la producción individual con el ordeño del día para detectar vacas que bajan."],cria:["Meta: un ternero destetado por vaca por año; un empadre estacional de 60–90 días facilita la nutrición y el manejo.","Una vaca que pare con buena condición corporal vuelve a preñarse antes: cuida la nutrición en el último tercio de gestación.","En el pico de lactancia (2–3 meses) la demanda de proteína y energía es máxima."],gen:["Mantén condición corporal moderada (≈3–3,5 de 5): ni flaca ni gorda, para no afectar la fertilidad.","Cuida el aporte de Zn, Cu, Se y vitaminas A y E, que sostienen la ovulación y la calidad seminal: usa una sal mineralizada de buena formulación.","Toros: evaluación andrológica antes de cada empadre. Donadoras: coordina la dieta con tu veterinario durante la superovulación o transferencia de embriones."],exh:["Prepara el acabado con varias semanas de anticipación y sube la energía de forma gradual.","Aporta fibra efectiva de buena calidad para proteger el rumen y evitar acidosis.","Adapta al animal a la dieta, el manejo y el transporte antes de la feria; mantén agua limpia y consumo estable.","Condición corporal objetivo ≈3,5–4 de 5: el exceso de grasa perjudica el juzgamiento y la fertilidad."],ter:["Creep feeding: ofrece al ternero concentrado aparte, con acceso solo para él, desde los ~2 meses para mejorar el peso al destete.","La nutrición de la vaca determina su leche y el peso del ternero: no recortes la suplementación en lactancia.","Pesa a los terneros al nacer y al destete para medir la ganancia."],ceba:["Referencia en Colombia: promedio nacional ≈300 g/día; novillos Brahman en pastoreo 500–680 g/día (AGROSAVIA); meta tecnificada ≈1 kg/día (Fedegán).","Pesa cada 30 días y calcula la GDP (ganancia diaria de peso): si cae, revisa pasto, minerales y parásitos.","La sal mineralizada puede sumar 60–90 g/día de GDP (Fedegán); en verano suplementa energía y proteína.","Rendimiento en canal de referencia: ≈53%."]};
const TT={Carne:{Lactancia:["Vaca de cría: su leche es el alimento del ternero; en el pico de lactancia suplementa proteína si el pasto es de baja calidad.","Destete del ternero a los 6–8 meses según su peso y la condición de la vaca.","Sal mineralizada todo el año; en verano agrega suplemento proteico-energético (AGROSAVIA)."],'Seca / preñada':["Vaca de cría gestante: en el último tercio sube la oferta de forraje y proteína sin engordarla.","Revisa la condición corporal 60 días antes del parto: ≈3 de 5.","Vacunas reproductivas y contra diarrea neonatal según tu veterinario."],Engorde:["Mezclas de subproductos (salvado de arroz, semilla de algodón) más sal mineralizada han dado hasta 650–940 g/día en novillos en pastoreo (AGROSAVIA).","En los últimos 2 meses de ceba, ~1 kg/día de suplemento energético mejora el acabado.","Cambia al concentrado en 2–3 semanas para evitar acidosis. Pesa cada 30 días."]},'Doble propósito':{Lactancia:["Doble propósito: ≈1 kg de concentrado por cada 4 L de leche sobre lo que aporta el pasto; el ternero al pie también demanda leche.","Reparte el concentrado en 2–3 tomas y mantén sal mineralizada a voluntad.","Los primeros 100 días son los de mayor desgaste: vigila que no pierda más de 1 punto de condición corporal."]}};

/* ===== v15 Asesor IA nutricional: base de conocimiento sin internet, guiada por propósito, enfoque y etapa ===== */
const KB=[
['rumen biologia fermentacion agv acetico propionico microbiota digestion','Cómo funciona el rumen','El rumen es una cámara de fermentación con bacterias, protozoos y hongos que convierten fibra y almidón en ácidos grasos volátiles (acético, propiónico, butírico): dan ~70 % de la energía. El acético sostiene la grasa de la leche; el propiónico, la glucosa y la ganancia de peso. Las bacterias fabrican proteína microbiana con nitrógeno y energía sincronizados: sin energía fermentable el nitrógeno se pierde como urea. pH sano 6,0–6,8; rumia ~8 h/día y 100–190 L de saliva (tampón natural).','NRC; textos de nutrición de rumiantes'],
['acidosis sara ph almidon concentrado fibra efectiva','Acidosis ruminal (SARA)','Aparece cuando el pH baja de 5,6 por mucho concentrado o poca fibra efectiva: menos grasa en leche, heces sueltas con burbujas, cojeras, caída de consumo. Prevención: 28–32 % de FDN en la dieta (≥19 % venido del forraje), concentrado en 2–3 tomas, bicarbonato 100–150 g/vaca/día si hay riesgo y cambios de dieta graduales en 2–3 semanas.','NRC 2001'],
['cetosis acetonemia betahidroxibutirato bhb posparto balance energetico negativo','Cetosis','Vacas de alta producción en las primeras 2–6 semanas posparto movilizan grasa y acumulan cuerpos cetónicos (BHB ≥1,2 mmol/L = subclínica). Señales: baja de leche, inapetencia, aliento a acetona. Prevención: CC 3–3,5 al parto (no gorda), dieta de transición, forraje de calidad, propilenglicol 300 mL/día en riesgo. Trata con tu veterinario.','NRC 2001; MSD Vet Manual'],
['hipocalcemia fiebre de leche paresia puerperal calcio parto vaca caida dca aniónica','Hipocalcemia (fiebre de leche)','Ocurre en 24–48 h tras el parto, más en vacas de 3+ partos. Prevención en vaca seca: calcio bajo (<0,5 % MS) o dieta aniónica (DCAD negativa) las últimas 3 semanas, magnesio 0,35–0,4 %, evitar forrajes ricos en potasio (kikuyo muy fertilizado). Vaca caída o fría: llamar al veterinario de inmediato.','NRC 2001'],
['timpanismo meteorismo hinchazon leguminosa alfalfa espuma','Timpanismo (hinchazón)','Gas atrapado en el rumen por leguminosas tiernas o pastos muy jóvenes y húmedos. Prevención: no soltar hambrientos en leguminosas, dar forraje fibroso antes, pastoreo gradual, aceites o poloxaleno según veterinario. Es urgencia: lado izquierdo distendido.','Fedegán; MSD Vet Manual'],
['tetania pastos hipomagnesemia magnesio pasto joven','Tetania de los pastos','Falta de magnesio con pastos jóvenes muy fertilizados con nitrógeno y potasio: nerviosismo, temblores, caídas. Prevención: sal mineralizada con 8–12 % Mg (óxido de magnesio), 20–30 g Mg/animal/día en riesgo, no fertilizar en exceso con potasio.','NRC; AGROSAVIA'],
['urea nitrogeno no proteico npn intoxicacion amonio melaza bloques','Urea y nitrógeno no proteico','La urea (46 % N, ≈287 % proteína equivalente) aporta proteína solo si hay energía fermentable (melaza, cereales). Límite: ≤1 % de la MS total o 100–150 g/vaca/día, mezclada, nunca pura ni en ayunas ni con animales sin adaptar (2–3 semanas). Intoxicación: temblor, timpanismo, espuma por la boca. No se da a terneros que no rumian.','NRC; AGROSAVIA'],
['proteina cruda pdr pnd degradable no degradable sobrepasante nitrogeno ureico leche nul','Proteína: degradable y sobrepasante','PC en dieta según etapa: cría 18–20 %, levante 14–16 %, vaca lechera 16–18 % (pico) y 12–14 % seca, carne en mantenimiento 8–9 %, ceba 11–13 %. En vacas de alta producción, 60 % de la proteína debe ser degradable (PDR) y 40 % sobrepasante (PNDR: harina de pescado, soya tratada). NUL (nitrógeno ureico en leche) ideal 12–16 mg/dL: alto = exceso de proteína o falta de energía.','NRC 2001'],
['energia enl mcal densidad energetica grasa sobrepasante','Energía de la dieta','Vaca en pico de lactancia: 1,6–1,7 Mcal ENL/kg MS; media lactancia 1,5–1,6; seca 1,3–1,4. Se sube con forraje digestible, almidón bien manejado y grasa sobrepasante (≤3 % de grasa añadida, total ≤6–7 % del extracto etéreo). Pastos tropicales maduros (<55 % digestibilidad) limitan el consumo: suplementa energía antes que proteína.','NRC 2001'],
['fibra fdn fda forraje efectiva rumia largo picado','Fibra y forraje','FDN mínimo 28–32 % en vacas lecheras (forraje ≥ 19 % FDN). En carne a pasto no hay problema; en ceba a corral deja ≥10–15 % de forraje largo. Forraje picado muy fino reduce rumia y saliva. FDA 19–21 % mínimo en lactancia.','NRC 2001'],
['minerales calcio fosforo magnesio potasio sodio azufre macrominerales sal mineralizada','Macrominerales','Dieta lactancia: Ca 0,6–0,8 %, P 0,35–0,40 %, Mg 0,20–0,25 %, K 1,0–1,2 %, Na 0,2 %, S 0,2 %. Carne: Ca 0,3–0,6 %, P 0,2–0,3 %. Relación Ca:P 1,5–2:1. En pasto tropical suele faltar P, Na, Cu, Zn y Co: sal mineralizada a voluntad (60–100 g/día en cría/carne, 100–150 g en lactancia) con ≥6 % de P.','NRC; AGROSAVIA'],
['oligoelementos cobre zinc selenio cobalto yodo manganeso hierro deficiencia','Microminerales (oligoelementos)','ppm de la MS: Cu 10–12, Zn 40–60, Mn 40, Co 0,1–0,2, I 0,5, Se 0,3. Deficiencias: Cu → pelo decolorado, “gafas”, diarrea (cuidado: molibdeno y azufre lo bloquean); Co → anemia y mal crecimiento; Se → músculo blanco, retención de placenta; Zn → pezuñas y piel. Exceso de Cu es tóxico en terneros.','NRC; AGROSAVIA'],
['fosforo carencia pica osteofagia huesos baja fertilidad','Déficit de fósforo','Típico en suelos ácidos tropicales (Llanos): vacas que mastican huesos, palos o tierra (pica), celos silenciosos, lento crecimiento. Corrige con sal fosfórica o mineralizada con 6–8 % P todo el año.','AGROSAVIA'],
['vitaminas a d e beta caroteno fertilidad inmunidad','Vitaminas A, D y E','Vit. A: reproducción y epitelios (vacas secas 75 000 UI/día aprox.); D: absorción de calcio; E: inmunidad y placenta (1 000 UI/día vaca seca en preparto). Los forrajes verdes dan caroteno; el ensilaje y heno lo pierden. Se suplementan vía mineral o inyectable.','NRC 2001'],
['agua consumo bebedero calidad litros','Agua','Necesidad aproximada: 3,5 L por kg de MS + 1 L por litro de leche (vaca de 25 L ≈ 90–110 L/día; más con calor). Bebedero limpio, sombreado, 5–6 cm de borde por vaca y acceso tras el ordeño. Poco agua baja la leche más rápido que poca comida.','NRC 2001'],
['estres calorico calor thi sombra ventilador bicarbonato','Estrés calórico','Con ITH (temperatura–humedad) sobre 72 la vaca lechera reduce consumo y leche. Medidas: sombra, agua fresca, concentrado en horas frescas, más energía y minerales (K 1,5 %, Na 0,5 %), bicarbonato 150 g, razas adaptadas (cebú, Romosinuano, Girolando, cruces). Cebuinos toleran mejor hasta ~35 °C.','NRC; U. de Antioquia'],
['condicion corporal cc escala bcs pesar evaluacion','Condición corporal (CC 1–5)','Meta: parto 3–3,5; pico de lactancia no bajar de 2,5; servicio ≥2,75–3; secado 3–3,5. Una vaca gorda al parto (≥4) sufre más cetosis, distocia y retención de placenta. Evalúa cada 30 días tocando lomo, ancas, costillas y base de la cola.','Fedegán; NRC'],
['vaca seca transicion preparto posparto periodo transicion','Vaca seca y transición','Seca 45–60 días (30–45 en baja producción). Últimos 21 días antes del parto: sube concentrado gradualmente (1–1,5 % del PV), proteína 14 %, calcio bajo o aniónica, Se y vit. E. Posparto: adapta a la dieta de alta producción en 3 semanas. Es la fase más crítica de salud y rentabilidad.','NRC 2001'],
['lactancia vaca leche produccion pico concentrado racion 100 dias','Vaca en lactancia (leche)','Pico a los 40–60 días posparto; consumo máximo hasta semana 10–14, por eso hay déficit energético. Regla práctica en pastoreo: el pasto de buena calidad sostiene 8–10 L; por cada 2,5 L extra, 1 kg de concentrado (≈20–22 % PC). Reparte en 2–3 tomas y ajusta cada 15 días con el litraje.','AGROSAVIA; Fedegán'],
['doble proposito cebu holstein cruce ternero al pie amamantamiento restringido','Doble propósito (leche y cría)','Vaca cruzada con ternero al pie: el ternero consume 6–10 % de su peso en leche. Pasto de calidad + 1 kg de concentrado por cada 4 L sobre lo que sostiene el pasto, sal mineralizada todo el año y amamantamiento restringido para acortar el anestro. Destete a los 7–9 meses o ≥ 200 kg. Meta: parto cada 12–13 meses.','AGROSAVIA; Fedegán'],
['ternero calostro lactancia destete iniciador sustituto lactoreemplazador','Terneros y cría','Calostro: 10 % del peso vivo (≈ 3–4 L) en las primeras 6 horas y otro tanto en 12 h (IgG ≥50 g/L). Agua limpia desde el día 3. Iniciador 18–20 % PC desde la semana 1; destetar al consumir ≥1 kg/día durante 3 días (≈8–10 semanas en lechería, 6–8 meses en carne). Ombligo con yodo. Evita diarreas con higiene y vacunas a la madre.','NRC 2001; Fedegán'],
['levante novilla reemplazo primera monta pubertad crecimiento gdp','Levante y reemplazos','Novilla lechera: 600–800 g/día, 14–16 % PC, primera monta al 60–65 % del peso adulto (Holstein ~350–380 kg a los 15 meses; cebú ~280–320 kg a los 20–24 meses). Exceso de energía antes de la pubertad daña la glándula mamaria; déficit retrasa el primer parto.','NRC 2001; AGROSAVIA'],
['ceba engorde novillo gdp ganancia peso suplementacion pastoreo corral','Levante y ceba (carne)','En pastoreo mejorado: 500–700 g/día; con suplemento (salvado de arroz, torta de palmiste, semilla de algodón, urea con melaza): 700–1 000 g/día. Ceba intensiva: 1,0–1,5 kg/día, 12–13 % PC, grano ≤60 % de la MS, adaptación de 15–21 días. Ceba cebú: 450–500 kg a 24–30 meses. Pesa cada 30 días.','AGROSAVIA; Fedegán'],
['cria vaca carne ternero destete empadre estacional condicion','Vaca de cría (carne)','Meta: un ternero destetado por vaca por año. Consumo 2,2–2,5 % del PV, PC 8–11 %. Último tercio de gestación y pico de lactancia son críticos. Empadre estacional de 60–90 días, CC 3 al parto, sal mineralizada todo el año y suplemento proteico-energético en verano.','AGROSAVIA; Fedegán'],
['genetica donadora reproductor toro embriones superovulacion','Genética (reproductores y donadoras)','Condición 3–3,5, no engordar. Zn, Cu, Se, vit. A y E mantienen ovulación y calidad seminal. Toros: 11–13 % PC, andrología antes del empadre. Donadoras: dieta estable, sin cambios bruscos ni ayunos antes y durante la superovulación.','NRC; textos de reproducción bovina'],
['exhibicion feria concurso preparacion acabado show','Exhibición (ferias y concursos)','Planifica 8–12 semanas: sube energía gradual, fibra efectiva para proteger el rumen, adaptación al manejo y transporte, agua constante y sin estrés. Condición 3,5–4. Evita la acidosis y la cojera por exceso de grano.','Fedegán; manuales de ferias'],
['kikuyo trópico alto cenchrus clandestinus lechería especializada antioquia','Kikuyo y trópico alto','Kikuyo (Cenchrus clandestinus): 16–22 % PC, 55–65 % FDN, rinde 8–14 t MS/ha/año, base de la lechería especializada de Antioquia y Cundiboyacá. Rotación de 35–45 días de descanso, ocupación 1 día, 2–3 L de leche por 1 kg de concentrado sobre lo que da el pasto. Alta proteína soluble y K: aporta energía (maíz, melaza) y vigila hipomagnesemia.','U. de Antioquia; AGROSAVIA'],
['brachiaria pasto tropical decumbens brizantha humidicola mombaza tanzania estrella','Pastos del trópico bajo','Brachiaria (decumbens, brizantha, humidicola): 8–12 % PC. Panicum (Mombasa, Tanzania): 10–14 % PC, necesitan buen manejo. Estrella (Cynodon): sabana y valle. Descanso 28–40 días según lluvia, entrada con 25–30 días de crecimiento en estrella. Carga: 1–2 UGG/ha con fertilización; mal manejo = degradación.','AGROSAVIA; Fedegán'],
['silvopastoril leucaena tithonia boton oro nacedero matarraton cratylia cipav arboles','Sistemas silvopastoriles','Leucaena, botón de oro (Tithonia), nacedero, matarratón y Cratylia aportan 18–28 % PC. Aumentan carne y leche, reducen concentrado y metano, dan sombra. CIPAV: 4 000–10 000 arbustos/ha en banco forrajero. Leucaena: mimosina, ofrecer ≤30–40 % de la dieta, adaptar el ganado.','CIPAV; AGROSAVIA'],
['ensilaje heno henolaje conservacion maiz sorgo verano sequia','Conservación de forraje','Ensilaje de maíz (30–35 % MS), pasto o sorgo para el verano: llena rápido, compacta, tapa sin aire y fermenta 21+ días. Heno de gramínea a 15–18 % de humedad. Ofrece 15–25 kg/vaca/día de ensilaje. Calcula la reserva para la época seca.','Fedegán; textos de forrajes'],
['subproductos torta palmiste salvado arroz semilla algodon pulpa citrica yuca banano cascarilla melaza dd','Subproductos y alimentos alternativos','Torta de palmiste (14–18 % PC, ≤20–30 % de la dieta); salvado de arroz (12–14 % PC, ≤30 %); semilla de algodón entera (23 % PC, ≤2,5 kg/vaca por gosipol); pulpa cítrica; yuca y banano de rechazo (energía); melaza (3–5 % de la dieta, palatabilidad). Compara el costo por kg de proteína o energía, no por kg de alimento.','AGROSAVIA; Fedegán'],
['bloques multinutricionales suplemento verano sequia urea melaza sal','Bloque multinutricional','Bloque de melaza, urea, sal mineralizada y salvado: 0,3–0,5 kg/día para animales en pasto maduro o paja. Aumenta consumo de forraje de baja calidad en verano. No sustituye el agua.','AGROSAVIA; Fedegán'],
['pastoreo rotacional voisin cerca electrica divisiones ocupacion descanso aforo','Pastoreo rotacional','Divide los potreros según días de descanso (28–45 días trópico bajo, 35–45 kikuyo) y ocupa 1–3 días. Aforo: ofrece 3,5–4 kg MS por 100 kg PV por día. Entra al potrero con 3–4 hojas (Brachiaria) y sal con ≥10 cm de residuo.','Fedegán; U. Nacional'],
['carga animal ugg unidad gran ganado capacidad hectarea','Carga animal','1 UGG = 450 kg de peso vivo. Capacidad = oferta de MS ÷ consumo (2,5 % PV). Con 8–12 t MS/ha/año y buen manejo se sostienen ≈ 1,5–2,5 UGG/ha. Exceso de carga degrada el potrero y baja la ganancia.','Fedegán'],
['formulacion racion cuadrado pearson proteina mezcla concentrado costo','Formular una mezcla','Cuadrado de Pearson: para lograr X % de PC, mezcla 2 ingredientes con más y menos proteína en proporción a las diferencias. Ej.: llegar a 18 % con maíz (9 %) y soya (44 %): partes de soya = 18−9 = 9, de maíz = 44−18 = 26; 26 maíz : 9 soya (74 % : 26 %). Después verifica energía, Ca, P y costo por kg de PC.','textos de nutrición animal'],
['reproduccion fertilidad celo anestro posparto nutricion preñez intervalo entre partos','Nutrición y reproducción','Mala nutrición = anestro y repeticiones. Llega al servicio con CC ≥2,75–3 y con balance energético que mejora. Proteína alta sin energía (NUL >18) y P, Cu, Zn, Se bajos afectan fertilidad. Meta IEP 365–400 días; primer servicio 50–70 días posparto en lechería.','NRC; AGROSAVIA'],
['peso metas edad referencia crecimiento carne holstein cebu brahman','Pesos de referencia','Orientativos: Holstein al nacer 40 kg, destete 90 kg (60–70 días), 15 meses 380 kg; cebú (Brahman, Gyr) al nacer 28–32 kg, destete 180–200 kg a 7–8 meses, 18 meses 280–330 kg; cruces intermedios. Usa Más › Referencias de peso para cargar tus propias metas.','Fedegán; asociaciones de raza'],
['mastitis leche calidad grasa proteina celulas somaticas conteo ucf nutricion','Calidad de la leche','Grasa baja: poca fibra o acidosis. Proteína baja: poca energía. NUL alto: exceso de proteína. Mastitis: higiene, sellado de pezones, secado con tratamiento y Se/vit. E. Leche: tiempos de retiro obligatorios tras antibióticos y antiparasitarios.','Fedegán; NRC 2001'],
['parasitos desparasitacion garrapata nematodos hematologia anemia nutricion','Parásitos y nutrición','Parásitos internos y garrapatas roban nutrientes: animales con buena proteína y minerales resisten mejor. Desparasita con diagnóstico (coprológico) y respeta el retiro de carne y leche. Alterna principios activos para frenar la resistencia.','ICA; textos veterinarios'],
['aflatoxinas micotoxinas hongos moho almacenamiento alimento humedad','Micotoxinas','Maíz, algodón y subproductos mal almacenados producen aflatoxina: menos consumo y leche, inmunidad baja, y residuos en leche. Almacena seco (<13 % humedad), sobre estibas, ventilado, y usa adsorbentes si hay riesgo.','textos de nutrición; ICA'],
['plantas toxicas intoxicacion helecho lantana crotalaria sin','Plantas tóxicas','Helecho, lantana, crotalaria y otras causan intoxicación sobre todo en potreros degradados o con hambre. Retira al animal, ofrece agua y busca al veterinario. Mantener buen pasto evita el consumo por necesidad.','Fedegán; veterinaria'],
