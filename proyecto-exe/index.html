<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Finca Evenezer</title>
<style>
:root{--bg:#f6f3ea;--c:#fff;--t:#2b2b22;--g:#2f6b3a;--m:#6b6b5e;--b:#ddd8c8;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#1b1d18;--c:#262921;--t:#ecebe0;--g:#6fbf7e;--m:#a5a595;--b:#3a3d33;color-scheme:dark}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font:15px system-ui,sans-serif;padding-bottom:70px}
header{display:flex;align-items:center;gap:8px;padding:10px 14px;background:var(--g);color:#fff}header b{font-size:18px}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--c);border-top:1px solid var(--b);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;border:0;background:none;color:var(--m);padding:8px 2px;font-size:11px}nav button.on{color:var(--g);font-weight:700}
main{padding:12px;max-width:640px;margin:auto}.card{background:var(--c);border:1px solid var(--b);border-radius:12px;padding:12px;margin-bottom:10px}
input,select,textarea{width:100%;padding:9px;margin:3px 0 8px;border:1px solid var(--b);border-radius:8px;background:var(--bg);color:var(--t);font:inherit}
label{font-size:12px;color:var(--m)}button.p{background:var(--g);color:#fff;border:0;border-radius:8px;padding:10px 14px;font:inherit;margin:2px}button.s{background:none;border:1px solid var(--g);color:var(--g);border-radius:8px;padding:8px 12px;margin:2px}
.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}.car{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:6px}.car img{width:100%;flex:0 0 100%;height:220px;object-fit:cover;border-radius:10px;scroll-snap-align:center}
.sm{color:var(--m);font-size:12px}.ov{position:fixed;inset:0;background:#0008;display:flex;align-items:center;justify-content:center;z-index:9;padding:16px}.ov .card{max-width:340px;width:100%}h3{margin:6px 0}
</style></head><body>

<script>
const K='fe_v1',D=()=>new Date().toISOString().slice(0,10);
let S;try{S=JSON.parse(localStorage.getItem(K))}catch(x){}
S=S||{an:[],milk:[],news:[],exp:[],feed:{},cfg:{co:'',user:'',meals:['06:00','12:00','18:00'],team:[],role:'dueño'}};
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(x){alert('Memoria llena: usa menos fotos')}};
const e=s=>String(s??'').replace(/[<>&"]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]));
const $=id=>document.getElementById(id),val=id=>($(id)||{}).value||'';
let tab='an',cur=null,ph=[];
const tabs={an:'🐄 Animales',cal:'📅 Agenda',lec:'🥛 Leche',nov:'⚠️ Novedades',gas:'💰 Gastos',aj:'⚙️ Ajustes'};
function age(b){if(!b)return'—';let a=new Date(b),n=new Date(),y=n.getFullYear()-a.getFullYear(),m=n.getMonth()-a.getMonth(),d=n.getDate()-a.getDate();if(d<0){m--;d+=new Date(n.getFullYear(),n.getMonth(),0).getDate()}if(m<0){y--;m+=12}return`${y} a, ${m} m, ${d} d`}
const an=id=>S.an.find(a=>a.id==id);
function nav(){$('nv').innerHTML=Object.entries(tabs).map(([k,v])=>`<button class="${tab==k?'on':''}" onclick="tab='${k}';cur=null;go()">${v}</button>`).join('')}
function go(){nav();$('st').textContent=navigator.onLine?'● en línea':'○ sin internet';(cur?det:{an:list,cal:cal,lec:lec,nov:nov,gas:gas,aj:aj}[tab])()}
function list(){$('v').innerHTML=`<button class="p" onclick="form()">+ Registrar animal</button>`+(S.an.filter(a=>!a.pid).map(a=>`<div class="card" onclick="cur=${a.id};go()"><b>${e(a.name)}</b> ${a.sex=='Hembra'?'♀':'♂'} <span class="sm">${e(a.brand)} · ${e(a.loc||'sin lote')}</span><br><span class="sm">Edad: ${age(a.birth)}</span></div>`).join('')||'<p class="sm">Aún no hay animales.</p>')}
function readImgs(inp,cb){[...inp.files].forEach(f=>{const r=new FileReader();r.onload=()=>{const i=new Image();i.onload=()=>{const c=document.createElement('canvas'),s=Math.min(1,500/i.width);c.width=i.width*s;c.height=i.height*s;c.getContext('2d').drawImage(i,0,0,c.width,c.height);cb(c.toDataURL('image/jpeg',.7))};i.src=r.result};r.readAsDataURL(f)})}
function form(pid){ph=[];const ch=!!pid,f=(i,l,t='text')=>`<label>${l}</label><input id="${i}" type="${t}">`;
$('v').innerHTML=`<div class="card"><h3>${ch?'Registrar hijo/a':'Nuevo animal'}</h3><label>Foto principal *</label><input type="file" accept="image/*" onchange="readImgs(this,d=>{ph.unshift(d);pv()})"><label>Más fotos (opcional)</label><input type="file" accept="image/*" multiple onchange="readImgs(this,d=>{ph.push(d);pv()})"><div id="pv" class="car"></div>
${f('n','Nombre *')}${f('mk','Marca'+(ch?' (opcional)':''))}${f('gu','Guía'+(ch?' (opcional)':''))}${f('bd','Fecha de nacimiento *','date')}<label>Género</label><select id="sx"><option>Hembra<option>Macho</select>${f('lo','Lote / ubicación')}${f('wt','Peso aprox. kg','number')}
<h3>Madre (opcional)</h3>${f('mn','Nombre')}${f('mr','Raza')}${f('mb','Nacimiento','date')}<h3>Padre (opcional)</h3>${f('pn','Nombre')}${f('pr','Raza')}${f('pb','Nacimiento','date')}
<button class="p" onclick="saveA(${pid||0})">Guardar</button><button class="s" onclick="go()">Cancelar</button></div>`}
const pv=()=>$('pv').innerHTML=ph.map(s=>`<img src="${s}">`).join('');
function saveA(pid){if(!val('n')||!val('bd')||!ph.length)return alert('Falta nombre, nacimiento o foto principal');S.an.push({id:Date.now(),pid,name:val('n'),brand:val('mk'),guia:val('gu'),birth:val('bd'),sex:val('sx'),loc:val('lo'),wt:val('wt'),photos:ph,mom:{n:val('mn'),r:val('mr'),b:val('mb')},dad:{n:val('pn'),r:val('pr'),b:val('pb')},vac:[]});save();pid?(cur=pid):0;go()}
function det(){const a=an(cur),kids=S.an.filter(k=>k.pid==a.id),f=S.feed[a.id]||{};
$('v').innerHTML=`<button class="s" onclick="cur=null;go()">← Volver</button><div class="card"><div class="car">${a.photos.map(s=>`<img src="${s}">`).join('')}</div><h3>${e(a.name)} ${a.sex=='Hembra'?'♀':'♂'}</h3>
<div class="sm">Marca: ${e(a.brand||'—')} · Guía: ${e(a.guia||'—')}<br>Nació: ${a.birth} · Edad: <b>${age(a.birth)}</b><br>Lote: ${e(a.loc||'—')} · Peso: ${e(a.wt||'—')} kg<br>Madre: ${e(a.mom.n||'—')} ${e(a.mom.r)} ${a.mom.b} <br>Padre: ${e(a.dad.n||'—')} ${e(a.dad.r)} ${a.dad.b}</div></div>
<div class="card"><h3>💉 Historial de vacunación</h3>${a.vac.map(v=>`<div class="sm">• <b>${e(v.n)}</b> — ${v.d} ${v.t} · próxima: ${v.nx}</div>`).join('')||'<p class="sm">Sin vacunas</p>'}
<label>Nombre de la vacuna</label><input id="vn"><div class="row"><div><label>Fecha</label><input id="vd" type="date" value="${D()}"></div><div><label>Hora</label><input id="vt" type="time"></div></div><label>Próxima dosis (vacío = +180 días automático)</label><input id="vx" type="date"><button class="p" onclick="addV()">Agregar vacuna</button></div>
<div class="card"><h3>🌿 Alimentación y consejo</h3><div class="row"><div><label>Pasto kg/día</label><input id="fp" type="number" value="${f.pasto||''}"></div><div><label>Purina kg/día</label><input id="fq" type="number" value="${f.pur||''}"></div></div><div class="row"><div><label>% proteína purina</label><input id="fr" type="number" value="${f.prot||''}"></div><div><label>% fibra/grasa/ingredientes</label><input id="fi" value="${e(f.ing||'')}"></div></div><div class="row"><div><label>Leche L/día</label><input id="fl" type="number" value="${f.lt||''}"></div></div><button class="p" onclick="calc()">Guardar y calcular</button><div id="adv" class="sm"></div></div>
<div class="card"><h3>👶 Hijos (${kids.length})</h3>${kids.map(k=>`<div class="sm">• <b onclick="cur=${k.id};go()">${e(k.name)}</b> ${age(k.birth)}</div>`).join('')}<button class="p" onclick="form(${a.id})">+ Agregar hijo</button></div>
<button class="s" onclick="if(confirm('¿Eliminar?')){S.an=S.an.filter(x=>x.id!=${a.id});save();cur=null;go()}">Eliminar animal</button>`;if(f.pasto||f.pur||f.lt)adv(a,f)}
function addV(){if(!val('vn'))return;const a=an(cur),d=val('vd')||D();let nx=val('vx');if(!nx){const x=new Date(d);x.setDate(x.getDate()+180);nx=x.toISOString().slice(0,10)}a.vac.push({n:val('vn'),d,t:val('vt'),nx});save();go()}
function calc(){const a=an(cur);S.feed[a.id]={pasto:+val('fp'),pur:+val('fq'),prot:+val('fr'),ing:val('fi'),lt:+val('fl')};save();adv(a,S.feed[a.id])}
function adv(a,f){const W=+a.wt||450,L=f.lt||0,dm=(.025*W+.1*L).toFixed(1),conc=(L/3).toFixed(1),agua=Math.round(40+4*L),pasteDM=f.pasto*.25,tot=pasteDM+f.pur*.88,p=f.pur?(f.pur*f.prot/100).toFixed(2):0;let m=[`Materia seca recomendada: ~${dm} kg/día (pasto fresco ≈ ${(dm*.6/.25).toFixed(0)} kg + concentrado).`,`Concentrado sugerido: ~${conc} kg/día (1 kg por cada 3 L de leche).`,`Agua: ~${agua} L/día. Sal mineralizada: ~100 g/día.`,`Aporta hoy: ${tot.toFixed(1)} kg MS y ${p} kg de proteína del concentrado.`];
if(f.pur&&tot<dm*.8)m.push('⚠️ Aporte por debajo del requerimiento: aumenta pasto o concentrado.');if(f.pur&&f.prot&&f.prot<14&&L>8)m.push('⚠️ Proteína baja (<14%) para vaca en producción; usa 16–18%.');if(f.pur>conc*1.5&&L)m.push('⚠️ Exceso de concentrado: riesgo de acidosis.');(a.sex=='Hembra'&&L==0)&&m.push('Vaca seca/novilla: prioriza forraje y mineral.');$('adv')&&($('adv').innerHTML=m.map(x=>'<p>'+x+'</p>').join(''))}
function cal(){const ev=[];S.an.forEach(a=>a.vac.forEach(v=>ev.push({d:v.nx,t:`${v.n} — ${a.name}`})));ev.sort((a,b)=>a.d>b.d?1:-1);$('v').innerHTML='<h3>Próximos vencimientos</h3>'+(ev.map(x=>`<div class="card" style="${x.d<D()?'border-color:#c33':''}"><b>${x.d}</b> ${e(x.t)} ${x.d<D()?'<span style="color:#c33">¡vencida!</span>':''}</div>`).join('')||'<p class="sm">Sin vacunas programadas.</p>')}
function lec(){const mes=D().slice(0,7),tot=S.milk.filter(m=>m.d.startsWith(mes)).reduce((s,m)=>s+m.l,0);$('v').innerHTML=`<div class="card"><h3>Registrar producción</h3><label>Vaca</label><select id="mv">${S.an.filter(a=>a.sex=='Hembra').map(a=>`<option value="${a.id}">${e(a.name)}`).join('')}</select><label>Litros</label><input id="ml" type="number"><button class="p" onclick="S.milk.push({a:val('mv'),l:+val('ml'),d:D()});save();go()">Guardar</button></div><div class="card">Total del mes: <b>${tot} L</b></div>`+S.milk.slice(-15).reverse().map(m=>`<div class="sm">${m.d} · ${e((an(m.a)||{}).name)} · ${m.l} L</div>`).join('')}
function nov(){$('v').innerHTML=`<div class="card"><h3>Nueva novedad</h3><select id="nt"><option>Enfermedad<option>Muerte<option>Nacimiento<option>Accidente<option>Otra</select><select id="na">${S.an.map(a=>`<option>${e(a.name)}`).join('')}</select><textarea id="nd" placeholder="Detalle"></textarea><button class="p" onclick="S.news.push({t:val('nt'),a:val('na'),x:val('nd'),d:D()});save();go()">Guardar</button></div>`+S.news.slice().reverse().map(n=>`<div class="card"><b>${n.t}</b> · ${e(n.a)} <span class="sm">${n.d}</span><br>${e(n.x)}</div>`).join('')}
function gas(){const mes=D().slice(0,7),tm=S.exp.filter(x=>x.d.startsWith(mes)).reduce((s,x)=>s+x.p*x.q,0);$('v').innerHTML=`<div class="card"><h3>Registrar gasto</h3><input id="gc" placeholder="Concepto (ej. bultos de purina)"><div class="row"><input id="gq" type="number" placeholder="Cantidad" value="1"><input id="gp" type="number" placeholder="Precio unitario"></div><button class="p" onclick="S.exp.push({c:val('gc'),q:+val('gq'),p:+val('gp'),d:D()});save();go()">Guardar</button></div><div class="card"><b>Gasto del mes: $${tm.toLocaleString()}</b></div>`+S.exp.slice().reverse().slice(0,20).map(x=>`<div class="sm">${x.d} · ${e(x.c)} · ${x.q} × ${x.p} = $${x.q*x.p}</div>`).join('')}
function aj(){const c=S.cfg;$('v').innerHTML=`<div class="card"><h3>Empresa ganadera / sesión (opcional)</h3><p class="sm">Desarrollado por <b>Grupo Inversion FM</b></p><p class="sm">Sin sesión, todo se guarda local en este dispositivo.</p><label>Nombre de la empresa</label><input id="co" value="${e(c.co)}"><label>Tu nombre</label><input id="us" value="${e(c.user)}"><label>Rol</label><select id="rl">${['dueño','trabajador','veterinario'].map(r=>`<option ${c.role==r?'selected':''}>${r}`).join('')}</select><h3>Horas de comida (las define el dueño)</h3>${c.meals.map((m,i)=>`<input type="time" id="ml${i}" value="${m}">`).join('')}<button class="p" onclick="S.cfg={...S.cfg,co:val('co'),user:val('us'),role:val('rl'),meals:[0,1,2].map(i=>val('ml'+i))};save();Notification&&Notification.requestPermission();alert('Guardado')">Guardar</button></div>
<div class="card"><h3>Invitar equipo</h3>${c.team.map(t=>`<div class="sm">• ${e(t.n)} (${t.r})</div>`).join('')}<input id="tn" placeholder="Correo o nombre"><select id="tr"><option>trabajador<option>veterinario</select><button class="p" onclick="S.cfg.team.push({n:val('tn'),r:val('tr')});save();go()">Invitar</button><p class="sm">⚠️ Para que otras personas entren desde sus teléfonos y compartan datos en línea hace falta un servidor (Firebase o Supabase). Esta versión guarda todo local y la lista de invitados queda como registro.</p></div>
<div class="card"><button class="s" onclick="syncNow()">Actualizar datos (cuando haya internet)</button><button class="s" onclick="const b=new Blob([JSON.stringify(S)]);const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='finca-respaldo.json';a.click()">Exportar respaldo</button></div>`}
function syncNow(){alert(navigator.onLine?'Datos locales al día. Conecta un servidor para sincronizar con el equipo.':'Sin internet: los datos siguen guardados en el dispositivo.')}
let asked={};setInterval(()=>{const n=new Date(),h=n.toTimeString().slice(0,5);S.cfg.meals.forEach((m,i)=>{const k=D()+i;if(h>=m&&!asked[k]&&!(S.feed.log||{})[k]&&!document.querySelector('.ov')){asked[k]=1;try{new Notification('Finca Evenezer',{body:'¿Ya alimentaste las vacas? (comida '+(i+1)+')'})}catch(x){}const o=document.createElement('div');o.className='ov';o.innerHTML=`<div class="card"><h3>🍽️ Comida ${i+1} (${m})</h3><p>¿Ya alimentaste las vacas?</p><button class="p" onclick="S.feed.log={...S.feed.log,'${k}':1};save();this.closest('.ov').remove()">Sí</button><button class="s" onclick="asked['${k}']=0;this.closest('.ov').remove()">No</button></div>`;document.body.append(o)}})},30000);
addEventListener('online',go);addEventListener('offline',go);go();
</script></body></html>
